[project]
name = "aegis-backend"
version = "0.1.0"
description = "Injection Arena (AEGIS) FastAPI backend: arena, AFF, admin, classroom, quiz"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.200",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15",
    "auth0-api-python==1.0.0b11",
    "jsonschema>=4.23",
    "google-re2>=1.1",
    "maxminddb>=3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "pip-audit>=2.10",
    "mmdb-writer>=0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.coverage.run]
source = ["app"]
omit = ["app/admin/*", "app/classroom/*", "app/quiz/*", "app/workers/*"]
